services:
  postgres:
    image: postgres:17
    container_name: camel-etl-postgres
    restart: unless-stopped

    ports:
      - "0.0.0.0:5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file; run Compose with --env-file .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file; run Compose with --env-file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file; run Compose with --env-file .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: camel-etl-pgadmin
    restart: unless-stopped

    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in the root .env file}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in the root .env file}
      PGADMIN_DISABLE_POSTFIX: "true"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
