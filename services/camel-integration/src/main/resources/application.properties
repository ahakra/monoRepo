spring.application.name=camel-integration
server.port=8081

# Read the shared local settings when launched from the repo or service directory.
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

# Configuration storage (separate from the connections configured in the UI).
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:camel_etl}}
spring.datasource.username=${POSTGRES_USER:camel_etl}
spring.datasource.password=${POSTGRES_PASSWORD:camel_etl}
spring.datasource.hikari.connection-timeout=5000

# Flyway owns schema changes; Hibernate validates the entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
